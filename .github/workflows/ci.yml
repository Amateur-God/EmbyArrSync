name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check EmbyArrSync.py tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/verify-dco.sh

  required:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [lint, test, dco]
    if: always()
    steps:
      - run: |
          for job in lint test; do
            result="${{ needs.lint.result }}"
            [[ "$job" == "test" ]] && result="${{ needs.test.result }}"
            if [[ "$result" != "success" ]]; then
              echo "$job failed: $result"
              exit 1
            fi
          done
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.dco.result }}" != "success" ]]; then
            echo "DCO failed"
            exit 1
          fi
          echo "All required CI checks passed."
