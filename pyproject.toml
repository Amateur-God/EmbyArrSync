[project]
name = "embyarrsync"
version = "0.0.0"
description = "Sync Emby watch history with Sonarr and Radarr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "python-slugify>=8.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
